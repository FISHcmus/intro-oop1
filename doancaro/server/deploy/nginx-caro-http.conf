server {
    server_name __CARO_PUBLIC_DOMAIN__;

    location = / {
        default_type text/plain;
        return 200 "Caro room server online.\nTCP endpoint: __CARO_PUBLIC_DOMAIN__:34567\n";
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:34569/healthz;
        proxy_set_header Host $host;
    }

    location = /status {
        proxy_pass http://127.0.0.1:34569/status;
        proxy_set_header Host $host;
    }

    listen 80;
}
